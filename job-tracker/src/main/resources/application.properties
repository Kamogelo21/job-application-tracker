jwt.secret=${JWT_SECRET:change-me-in-dev}
jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRE_MS:900000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRE_MS:2592000000}

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:h2:mem:jobtrackerdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
